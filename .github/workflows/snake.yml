name: Refresh profile and contribution snake

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/update_profile.py'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'firdavsyangiev/firdavsyangiev' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read the profile username
        id: profile
        run: |
          username=$(python3 -c 'from scripts.update_profile import USERNAME; print(USERNAME)')
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Generate contribution snakes from real GitHub data
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ steps.profile.outputs.username }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2da44e&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7ee787&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake SVGs to the output branch
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir="$RUNNER_TEMP/profile-output"
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add --detach "$publish_dir" origin/output
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan profile-output
            git -C "$publish_dir" rm -rf .
          fi
          cp dist/github-snake.svg dist/github-snake-dark.svg "$publish_dir/"
          git -C "$publish_dir" add github-snake.svg github-snake-dark.svg
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m 'Update contribution snake'
            git -C "$publish_dir" push origin HEAD:output
          fi
          git worktree remove "$publish_dir"

      - name: Refresh stats and verified project links
        run: python3 scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_PUBLISHED: 'true'

      - name: Save profile updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add README.md assets/stats.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile data'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
